name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

  deploy:
    name: Trigger Render deploy
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Error: RENDER_API_KEY and RENDER_SERVICE_ID are required secrets."
            exit 1
          fi
          echo "Triggering a deploy for Render service $RENDER_SERVICE_ID"
          RESPONSE=$(curl -sS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}')
          echo "$RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | python -c 'import sys, json; obj=json.load(sys.stdin); print(obj.get("id", ""))')
          if [ -z "$DEPLOY_ID" ]; then
            echo "Render deploy API did not return a deploy id."
            exit 1
          fi
          echo "Render deploy triggered: $DEPLOY_ID"
